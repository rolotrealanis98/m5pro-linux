# aurora-camera-denoise settings for this machine (installed by the m5pro package build).
# All users; ~/.config/aurora-camera-denoise/denoise.conf wins over this file.
# After editing: systemctl --user reload aurora-camera-denoise (or restart it).
# Every key is documented in /usr/share/aurora-camera-denoise/examples/denoise.conf.
[denoise]
# Anti-flicker for 60 Hz mains (the camera defaults to 50 Hz). Set before each stream and kept
# afterwards for apps that open /dev/video0 directly. Use 50 or auto elsewhere, off to leave it alone.
power-line = 60

# The spatial post stage after the temporal filter: dark-speck removal, radial luma denoise
# (stronger towards the corners) and chroma denoise. On by default; these are the defaults.
# post = off              # the whole stage off, back to the temporal filter alone
# post-impulse = 24
# post-luma = 1.0
# post-luma-clip-center = 6
# post-luma-clip-edge = 22
# post-chroma = 1.0
# post-chroma-clip-center = 8
# post-chroma-clip-edge = 24

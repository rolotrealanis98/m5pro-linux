# camera-v4l2-bridge settings (sourced by /usr/local/libexec/m5pro-camera-v4l2-bridge). Restart the user service after edits:
#   systemctl --user restart m5pro-camera-v4l2-bridge
# The loopback device (must match card_label in /etc/modprobe.d/m5pro-camera-v4l2-bridge.conf):
CARD_LABEL="FaceTime HD Camera (Clean)"
# The PipeWire camera to relay: the Video/Source whose node.description is this and whose node.name is not a raw v4l2 node.
SOURCE_DESCRIPTION="FaceTime HD Camera"
# What V4L2 apps get. One fixed format: lower WIDTH/HEIGHT to save CPU (1280/720 is enough for calls).
FORMAT=YUY2
WIDTH=1920
HEIGHT=1080
FRAMERATE=30/1
# 1 = keep the device format and listing across a bridge restart (but the device then also lists while the bridge is down,
# and a reader gets no frames). 0 = like Intel's v4l2-relayd.
KEEP_FORMAT=0
# Extra v4l2-relayd options, e.g. -d for debug.
EXTRA_OPTS=""

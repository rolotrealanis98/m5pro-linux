# Keep the loopback device out of PipeWire: portal apps already get the clean "FaceTime HD Camera" node, and a second
# "(Clean) (V4L2)" source would be a duplicate that feeds the bridge back into itself.
monitor.v4l2.rules = [
  {
    matches = [
      { device.description = "FaceTime HD Camera (Clean)" }
      { api.v4l2.cap.card = "FaceTime HD Camera (Clean)" }
      { device.name = "~v4l2_device.platform-v4l2loopback*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

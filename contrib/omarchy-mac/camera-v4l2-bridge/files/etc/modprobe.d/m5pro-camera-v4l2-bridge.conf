# One v4l2loopback device for the clean camera (camera-v4l2-bridge). exclusive_caps=1: the node lists as a capture
# device only while the bridge holds the writer side, so apps never see an empty camera. card_label is at most 31 chars.
# These options are global for the module: another v4l2loopback user (OBS virtual camera) needs its own device here.
options v4l2loopback devices=1 video_nr=10 card_label="FaceTime HD Camera (Clean)" exclusive_caps=1 max_buffers=4

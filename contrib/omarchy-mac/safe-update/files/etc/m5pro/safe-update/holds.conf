# m5pro-safe-update: holds, pins and watch lists. One directive per line: KEY value...  ('#' starts a comment).
#
# hold PKG...            extra --ignore for the upgrade, on top of /etc/pacman.conf IgnorePkg (globs allowed). Needed because
#                        IgnorePkg misses our hand-built or Aurora packages and the libs that move in lockstep with a held one.
# ignore-required WORD   a word that /etc/pacman.conf IgnorePkg must contain; the wrapper refuses to run without it
#                        (an Omarchy migration or 'refresh pacman' rewrites pacman.conf and drops the line).
# pin PKG REGEX          installed version must match REGEX before and after (FAIL otherwise).
# protect PKG            must stay installed, never replaced or removed (in addition to every pkg: row of INVENTORY.md).
# watch PKG              a library package /opt/mesa-aurora may link; reported when it upgrades (deep mode checks the soname).
# hook PATH              a pacman hook (or guard script) that must exist.

# --- boot chain and firmware: already in IgnorePkg on the Mac, required so the line cannot silently disappear
ignore-required hyprland
ignore-required linux-aarch64*
ignore-required linux-asahi*
ignore-required linux-aurora*
ignore-required m1n1
ignore-required omarchy-mac-boot
ignore-required omarchy-mac
ignore-required mesa-aurora
ignore-required linux-firmware
ignore-required uboot-*
ignore-required limine

# --- extra holds (not in the IgnorePkg line of the snippet)
# Touch ID: Aurora libfprint, epoch 2. The pacman guard hook aborts the whole transaction if it would move, so hold it here
# and keep the transaction going.
hold libfprint-git libfprint libfprint-aurora
# Speakers (speaker agent owns them): never move without the speaker agent's say-so.
hold speakersafetyd speakerguardd-v2 aurora-speaker-upgrade asahi-audio aurora-audio triforce-lv2
hold alsa-ucm-conf-asahi alsa-ucm-conf-aurora
# Our power-profiles build (0.30-9 from Omarchy edge, J716s patch set).
hold omarchy-power-profiles-daemon power-profiles-daemon
# Video and camera userspace built for the Aurora kernel.
hold libva-v4l2-request-avd libva-v4l2_request-avd avd-fw aurora-camera-denoise aurora-camera
# Hyprland 0.57.1 with our scanout patch is held; its libraries move in lockstep with it.
hold hyprland-m5pro hyprland aquamarine hyprutils hyprlang hyprcursor hyprgraphics hyprwayland-scanner hyprland-qt-support hyprtoolkit hyprwire hyprland-protocols hyprland-guiutils
# Boot and platform packages from any repo.
hold omarchy-aurora-firmware aura aura-* aurora-fwextract aurora-scripts aurora-bless asahi-bless

# --- pins
pin libfprint-git ^2:1\.94\.100\.aurora
pin omarchy-power-profiles-daemon ^0\.30-9$

# --- protect (also: every pkg: in INVENTORY.md that is installed)
protect speakerguardd-v2
protect aurora-camera-denoise
protect libva-v4l2-request-avd
protect omarchy-power-profiles-daemon
protect libfprint-git
protect fprintd
protect hyprland-m5pro

# --- libraries /opt/mesa-aurora-* may link (stock mesa is only the software fallback; the GPU session uses the /opt tree)
watch llvm-libs
watch libdrm
watch libglvnd
watch wayland
watch libxcb
watch libx11
watch libxshmfence
watch zstd
watch expat
watch elfutils
watch libelf
watch spirv-tools
watch spirv-llvm-translator
watch libclc
watch clang
watch libffi
watch lm_sensors
watch libunwind
watch zlib
watch libxml2
watch libedit
watch gcc-libs
watch glibc
watch vulkan-icd-loader
watch libva

# --- required pacman hooks
hook /etc/pacman.d/hooks/00-m5pro-boot-guard.hook
hook /etc/pacman.d/hooks/50-m5pro-touchid-guard.hook
hook /usr/local/sbin/m5pro-boot-guard
hook /usr/local/lib/m5pro/touchid-pacman-guard

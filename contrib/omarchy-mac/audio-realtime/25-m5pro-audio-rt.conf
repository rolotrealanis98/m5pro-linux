# m5pro: PipeWire realtime without depending on rtkit timing at boot (pipewire asked rtkit before it was up and ran its
# audio thread at normal priority, so desktop load caused resyncs on the speaker sense capture). Members of audio may
# raise RT priority and nice; PipeWire module-rt then uses these limits directly (rt.prio 88, nice -11).
@audio   -  rtprio     95
@audio   -  nice       -19
@audio   -  memlock    4194304

# J716s three-channel microphone array (omarchy-mac item mic-array). Same as aop_audio/3chan/HiFi.conf
# without JackControl: the J716s HPAI card exposes no controls.

SectionDevice."Mic" {
	Comment "Microphone"

	Value {
		TQ Voice
		CaptureChannels "3"
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
	}
}

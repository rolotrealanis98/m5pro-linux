Syntax 7

# MacBook Pro 16" M5 Pro/Max (J716s): the HPAI card of the t8152 AOP audio driver (card id AppleJ716HPAI,
# long name "MacBook Pro J716 High-Power Audio Interface"), the three-capsule microphone array on PCM 0,
# 3 x float32 at 48 kHz. Same shape as upstream's "MacBook Pro J616 High-Power Audio Interface.conf", but the
# verb is our own j716s/HiFi.conf instead of 3chan/HiFi.conf: upstream's newer 3chan/HiFi.conf names a
# JackControl "Internal Mic Jack" (the lid switch) that this kernel's HPAI card does not have.
# omarchy-mac item mic-array.

SectionUseCase."HiFi" {
	Comment "Default"
	File "/conf.d/aop_audio/j716s/HiFi.conf"
}

# J716s microphone array (omarchy-mac item mic-array): hw:AppleJ716HPAI,0, 3 x float32 at 48 kHz.
# The t8152 AOP audio driver names the card AppleJ716HPAI; the R3 bring-up driver (t8140-aop-audio) named it
# AppleJ716AOP, which is what the first version of this file matched, so after the driver change no rule
# applied and apps got the raw 3-channel AUX node at about -70 dBFS: no usable signal.
# Same shape as aurora-silicon/asahi-audio conf/wireplumber.conf (HPAI rules): rename the raw array RawMics,
# wrap it in the mic graph (equal mix, +36 dB, 120 Hz high-pass, limiter) and hide the raw node.
# The second match in each rule (card id + PCM number) keeps the rule working if UCM is not used
# (without UCM the node's api.alsa.path is "hw:0").
monitor.alsa.rules = [
    {
        matches = [
            { api.alsa.path = "hw:AppleJ716HPAI,0" }
            { alsa.id = "AppleJ716HPAI", alsa.device = 0 }
            { api.alsa.path = "hw:AppleJ716AOP,0" }
        ]
        actions = {
            update-props = {
                node.name = "alsa_input.platform-sound.RawMics"
                node.description = "Raw Mic Device (do not use)"
                node.nick = "RawMics"
            }
        }
    }
]

node.software-dsp.rules = [
    {
        matches = [
            { api.alsa.path = "hw:AppleJ716HPAI,0" }
            { alsa.id = "AppleJ716HPAI", alsa.device = 0 }
            { api.alsa.path = "hw:AppleJ716AOP,0" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/asahi-audio/j716/mic.json"
                hide-parent = true
            }
        }
    }
]

# software-dsp is not in WirePlumber's default main profile; asahi-audio's wireplumber.conf turns it on, and
# asahi-audio is not installed here. The only node.software-dsp rule on this Mac is the one above
# (speakerguardd v2 builds the speaker graph itself), so this changes nothing for the speakers.
wireplumber.profiles = {
    main = {
        node.software-dsp = required
    }
}

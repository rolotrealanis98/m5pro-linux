# WirePlumber fragment: the J716 microphone array (hw:AppleJ716AOP,0, 3 x float32 at 48 kHz).
# Install: /usr/share/wireplumber/wireplumber.conf.d/99-asahi-j716-mic.conf
# Same shape as edimoldovan's J714 rules (aurora-silicon/asahi-audio#20): rename the raw array
# RawMics and wrap it in the mic graph. No rule in asahi-audio's 99-asahi.conf matches AppleJ716AOP.
monitor.alsa.rules = [
    {
        matches = [
            { api.alsa.path = "hw:AppleJ716AOP,0" }
        ]
        actions = {
            update-props = {
                node.name = "alsa_input.platform-sound.RawMics"
                node.description = "Raw Mic Device (do not use)"
                node.nick = "RawMics"
            }
        }
    }
]

node.software-dsp.rules = [
    {
        matches = [
            { api.alsa.path = "hw:AppleJ716AOP,0" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/asahi-audio/j716/mic.json"
                hide-parent = true
            }
        }
    }
]

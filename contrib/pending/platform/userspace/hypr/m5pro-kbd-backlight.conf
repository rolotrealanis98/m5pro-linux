# Hyprland binds for the J716s keyboard backlight. The M5 MacBook Pro has no
# keyboard-light keys (F5/F6 are dictation / do-not-disturb on this layout),
# so XF86KbdBrightness* only fires from external keyboards; SUPER+F5/F6 work
# on the built-in one. Needs brightnessctl. source = ~/.config/hypr/m5pro-kbd-backlight.conf
bindel = , XF86KbdBrightnessUp, exec, brightnessctl -d kbd_backlight set +10%
bindel = , XF86KbdBrightnessDown, exec, brightnessctl -d kbd_backlight set 10%-
bindel = SUPER, F6, exec, brightnessctl -d kbd_backlight set +10%
bindel = SUPER, F5, exec, brightnessctl -d kbd_backlight set 10%-

# m5pro-linux (J716s, M5 Pro): safe default while SMC power-off and s2idle
# are unverified. logind takes no action on the power key, lid or sleep keys.
# The SMC still forces power-off on a long power-button hold, and the kernel
# (macsmc-input) tries an orderly power-off/restart just before that.
# Later stages: /usr/share/m5pro-platform/stages/ (see README).
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleHibernateKeyLongPress=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore

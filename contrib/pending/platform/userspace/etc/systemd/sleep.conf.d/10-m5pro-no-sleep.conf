# m5pro-linux (J716s): no sleep of any kind until the s2idle test plan
# (TEST-PLAN S1-S6) passes. Hibernation is never supported on this machine
# (kernel built without CONFIG_HIBERNATION; spin-table CPUs cannot be
# offlined). systemctl suspend/hibernate are refused with this file.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no

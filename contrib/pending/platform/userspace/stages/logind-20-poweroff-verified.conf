# Stage P (TEST-PLAN P2 passed: `poweroff` really powers the M5 off).
# Install as /etc/systemd/logind.conf.d/20-m5pro-power.conf (overrides 10-).
# Short press locks (there is no suspend yet); the long hold stays with the
# kernel/SMC forced power-off. Lid close locks the session.
[Login]
HandlePowerKey=lock
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=ignore

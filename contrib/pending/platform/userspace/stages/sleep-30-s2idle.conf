# Stage S: suspend means s2idle ("freeze") only. There is no "mem"/"deep"
# state on Apple Silicon (no PSCI SYSTEM_SUSPEND) and no hibernation.
# Install as /etc/systemd/sleep.conf.d/30-m5pro-s2idle.conf.
[Sleep]
AllowSuspend=yes
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
SuspendState=freeze

# J716s hypridle (m5pro desktop defaults, 2026-11-16). Staged, not installed.
# Replaces the bring-up's lock-only file (contrib/validated/desktop/omarchy/omarchy-setup.sh:338).
#
# - No screensaver listener: Omarchy's alacritty + ttfx screensaver at 120 fps cost ~7700 IPIs/s and
#   23x the display-coprocessor mailbox traffic on next4 (low-power/FINDINGS-20261116.md).
# - Panel off one minute after the lock. Needs the attended DPMS cycle first (queue item 8):
#     hyprctl dispatch dpms off; sleep 5; hyprctl dispatch dpms on
# - Suspend stays off until a lid / key wake from s2idle has been proven with the owner present
#   (s2idle is proven only with the watchdog-timer wake). Uncomment the last listener then.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    inhibit_sleep = 3
}

# Dim the backlight to 10 % after 4 min 30 s, restore on activity.
listener {
    timeout = 270
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Keyboard backlight off with the dim.
listener {
    timeout = 270
    on-timeout = brightnessctl -sd kbd_backlight set 0
    on-resume = brightnessctl -rd kbd_backlight
}

# Lock after 5 min.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Panel off after 5 min 30 s.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}


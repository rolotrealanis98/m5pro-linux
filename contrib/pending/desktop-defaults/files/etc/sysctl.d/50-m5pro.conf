# zram is the only swap: favour it over dropping page cache (the usual zram setting).
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
# RT tasks without a clamp of their own (speakerguardd v2's 82 Hz helper threads) no longer pull a CPU
# cluster to its top state. Needs CONFIG_UCLAMP_TASK (next4b and later). The value comes from the
# attended A/B (bench/lowpower/uclamp-ab.sh, queue item 3); until then the kernel default (1024) stays.
# kernel.sched_util_clamp_min_rt_default = 0

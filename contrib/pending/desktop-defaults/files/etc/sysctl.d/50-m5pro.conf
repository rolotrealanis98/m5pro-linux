# zram reclaim tuning (swappiness, page-cluster, watermarks) is Omarchy's now: /etc/sysctl.d/99-omarchy-sysctl.conf
# sorts after this file and sets the same keys (swappiness 150, with its reasoning). Ours were overridden, so dropped (2026-11-17).
# RT tasks without a clamp of their own (speakerguardd v2's 82 Hz helper threads) no longer pull a CPU
# cluster to its top state. Needs CONFIG_UCLAMP_TASK (next4b and later). Idle A/B on the J716s
# (bench/lowpower/uclamp-ab.sh, 2026-11-17, panel off, 2 runs, 6 + 4 one-minute phases): 1024 kept the
# P-cluster at its top state 28-32 % of the time at 3.49-3.63 W; 128 kept it at 0 % at 3.21-3.35 W.
# No speakerguardd errors in either run.
kernel.sched_util_clamp_min_rt_default = 128

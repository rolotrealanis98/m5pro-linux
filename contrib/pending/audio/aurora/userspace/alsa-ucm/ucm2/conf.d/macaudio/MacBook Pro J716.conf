Syntax 6
# MacBook Pro 16" M5 Pro/Max (J716). Same as J516: CS42L84 jack on PCM 0,
# six-channel speaker PCM 1. The Speaker device only appears when the
# kernel exposes the amp controls (macaudio speakers enabled).

SectionUseCase."HiFi" {
	Comment "Default"
	Define.JackCodec "cs42l84"
	Define.PlaybackChannels "6"
	Define.JackDevice "0"
	Define.SpeakerDevice "1"
	Define.SpeakerElem "Left Woofer 1 Speaker Volume"
	File "/conf.d/macaudio/laptops/HiFi.conf"
}

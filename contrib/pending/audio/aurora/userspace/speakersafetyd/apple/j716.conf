# SPDX-License-Identifier: GPL-2.0-only
# speakersafetyd profile for MacBook Pro 16-inch M5 Pro/Max (J716s/J716c),
# acoustic ID 41. BRING-UP PROFILE, NOT VALIDATED ON HARDWARE.
#
# Derived from conf/apple/j316.conf (AsahiLinux/speakersafetyd), which
# J416 and J516 symlink to. The amp (SN012776 x6), speaker layout
# (2 woofers + 1 tweeter per side), V/I sense slot map and ADT amp gain (15)
# are identical to J516, so every amp-side number below is copied verbatim.
# The speaker thermal model is NOT known for AID41 (new chassis), so the
# thermal numbers are copied and then made more conservative:
#
#   value            j316       j716    why
#   t_limit          140.0      120.0   start reducing 20 C earlier
#   tr_coil   W/T    23.0/45.0  28.75/56.25  x1.25: predict hotter coil
#   tr_magnet W/T    40.0/50.0  50.0/62.5    x1.25: predict hotter magnet
#   tau_*            copied     copied  (unknown; see REPORT.md)
#   z_nominal        3.60       3.60    ADT speaker-thiele-small Re 3.29-3.39
#                                       ohm on this machine, J516-like
#   t_ambient        50.0       50.0    pessimistic cold-boot start
#
# Raising t_limit or lowering tr_* back to the j316 values is only safe
# once measured AID41 data says so (beyond TEST-PLAN B4).
# Copied unchanged: is_scale/vs_scale (SN012776 sense ADC full scale),
# a_t_20c/a_t_35c (copper voice-coil tempco), z_shunt,
# visense_pcm/channels/period, link_gains, uclamp_max.
#
# Channel map: NOT j316's. Amp n in ADT order (LW1 RW1 LW2 RW2 LT RT) sends
# I on channel 2n and V on 2n+1, matching ti,imon/vmon-slot-no in
# t6050-j716s-audio.dts. Same map as Aurora Silicon's j616.conf (M4 Pro 16",
# tested amp by amp on the same AOP stream design). j316 puts the tweeters
# before the second woofers. TEST-PLAN B3 re-checks it per amp.
#
# Install: /usr/share/speakersafetyd/apple/j716.conf. speakersafetyd strips
# trailing letters from the first DT compatible ("apple,j716s" -> apple/j716)
# and opens hw:AppleJ716 (macaudio card id "Apple" + "J716").

[Globals]
visense_pcm = 2
t_ambient = 50.0
t_hysteresis = 5.0
t_window = 20.0
channels = 12
period = 4096
link_gains = True
uclamp_max = 64

[Controls]
vsense = VSENSE Switch
isense = ISENSE Switch
amp_gain = Amp Gain Volume
volume = Speaker Volume

[Speaker/Left Woofer 1]
group = 1
tr_coil = 28.75
tr_magnet = 50.00
tau_coil = 5.60
tau_magnet = 197.25
t_limit = 120.0
t_headroom = 10.0
z_nominal = 3.60
z_shunt = 0.09
a_t_20c = 0.00374895
a_t_35c = 0.00354903
is_scale = 3.75
vs_scale = 14
is_chan = 0
vs_chan = 1


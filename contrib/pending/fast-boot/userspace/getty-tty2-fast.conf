[Service]
# fast-boot: getty@.service is Type=idle, which holds the autologin until every other start job is done (up to 5 s:
# the speaker switch test, touchid-up, the 90 s m5-selftest of a test boot). The desktop does not need to wait for them.
# Same autologin line as autovt@tty2.service.d/autologin.conf, plus no /etc/issue banner and no hostname on the console.
# The file name sorts after autologin.conf so this ExecStart wins.
Type=simple
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --noclear --noissue --nohostname --autologin rolo %I $TERM

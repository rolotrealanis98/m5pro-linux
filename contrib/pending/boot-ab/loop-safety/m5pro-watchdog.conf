# /etc/systemd/system.conf.d/m5pro-watchdog.conf
# The stage-1 watchdog is handed to Linux armed (m1n1.wdt=keep, apple_wdt, 30 s). PID 1 owns it from here on.
# Needs a daemon-reexec or a reboot; WatchdogDevice defaults to /dev/watchdog0. RuntimeWatchdogPreSec stays unset
# (apple_wdt has no pretimeout). Never close the device with the magic character (a plain close leaves it armed).
[Manager]
RuntimeWatchdogSec=60
RebootWatchdogSec=5min

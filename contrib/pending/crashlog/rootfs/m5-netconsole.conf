# /etc/m5-netconsole.conf - read by /usr/local/sbin/m5-netconsole-up.
# STUDIO_IP: the Studio's address ON THE SAME ETHERNET LAN as the MacBook's USB adapter (or any
# host reachable through the LAN's router). Not a Tailscale 100.x address: netconsole writes raw
# Ethernet frames from the panic path and cannot go through tailscaled. Replace the placeholder on
# the MacBook only; never commit the real address.
STUDIO_IP=@STUDIO_IP@
PORT=6666
# Optional: force the interface (default: whatever the route to STUDIO_IP uses).
#DEV=enp0s...

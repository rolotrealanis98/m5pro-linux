# apple_sep options for the initramfs phase. The root's /etc/modprobe.d/apple-sep.conf has xart_writes=1 provision_keybag=1
# xart_guard=1 (Touch ID enrol/match state); the initramfs phase must not write the enclave's store at all, so it is
# read-only here: an unseal that would need an xART write fails and the volume asks for its passphrase instead.
# The OS identity pin (apple_sep.os_uuid_hi/_lo) is taken from the kernel command line by m5-crypt.sh.
SEP_OPTS="xart_writes=0 provision_keybag=0 xart_guard=1"

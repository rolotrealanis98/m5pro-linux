Syntax 6

# MacBook Pro 16" M5 Pro/Max (J716). Same as J516: CS42L84 jack on PCM 0,
# six-channel speaker PCM 1. The Speaker device only appears when the
# kernel exposes the amp controls (macaudio speakers enabled).
#
# The HiFi use case is the J716's own copy of laptops/HiFi.conf with a copy
# of cs42l84/Headphones.conf (j716/), because alsa-ucm-conf-asahi's Headset
# device sets the control 'Jack ADC Preamp Gain', which the CS42L84 driver
# does not have (it is 'Jack ADC Preamp Capture Volume'). A cset on a missing
# control fails the whole enable sequence.

SectionUseCase."HiFi" {
	Comment "Default"
	Define.JackCodec "cs42l84"
	Define.PlaybackChannels "6"
	Define.JackDevice "0"
	Define.SpeakerDevice "1"
	Define.SpeakerElem "Left Woofer 1 Speaker Volume"
	File "/conf.d/macaudio/j716/HiFi.conf"
}

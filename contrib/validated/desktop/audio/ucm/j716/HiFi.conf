# For laptops with 6 speakers (4 woofers and 2 tweeters): the J716's copy of
# laptops/HiFi.conf. The jack codec is always the CS42L84, so the codec
# switch is gone and the Headphones/Headset devices come from j716/.

SectionVerb {
	EnableSequence [
		cset "name='Headphone Playback Mux' 'Primary'"
		cset "name='Speaker Playback Mux' 'Secondary'"
	]

	Value {
		TQ "HiFi"
	}
}

Include.hp.File "/conf.d/macaudio/j716/Headphones.conf"

If.havespk {
	Condition {
		Type ControlExists
		Control "name='${var:SpeakerElem}'"
	}
	True {
		SectionDevice."Speaker" {
			Comment "Speakers"

			EnableSequence [
				cset "name='Speaker Switch' on"
			]

			Value {
				PlaybackChannels "${var:PlaybackChannels}"
				PlaybackPriority 100
				PlaybackPCM "hw:${CardId},${var:SpeakerDevice}"
			}
		}
	}
}

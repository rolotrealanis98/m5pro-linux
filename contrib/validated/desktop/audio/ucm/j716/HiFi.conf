# For laptops with 6 speakers (4 woofers and 2 tweeters): the J716's copy of
# laptops/HiFi.conf (alsa-ucm-conf-asahi 96b3206, plus its speakerguardd v2
# condition below). The jack codec is always the CS42L84, so the codec
# switch is gone and the Headphones/Headset devices come from j716/.

SectionVerb {
	EnableSequence [
		cset "name='Headphone Playback Mux' 'Primary'"
		cset "name='Speaker Playback Mux' 'Secondary'"
	]

	Value {
		TQ "HiFi"
	}
}

Include.hp.File "/conf.d/macaudio/j716/Headphones.conf"

If.havespk {
	Condition {
		Type ControlExists
		Control "name='${var:SpeakerElem}'"
	}
	True {
		# speakerguardd v2 owns the speaker PCM this boot (its provisioning writes the marker
		# before any session starts, beside the WirePlumber rules that disable the node for this
		# PCM): the speakers are its voicing sink, so the card offers no Speaker device. Without
		# this the desktop lists a second, dead "Speakers" port and WirePlumber's probe of the
		# device opens the raw speaker PCM. The verb (the mux) and the jack devices are unchanged.
		# Condition and comment from alsa-ucm-conf-asahi 96b3206 laptops/HiFi.conf; without the
		# marker (speakerguardd-v2 not installed or not running) nothing changes.
		If.sgv2 {
			Condition {
				Type Path
				Path "/run/speakerguardd-graph/speakerguardd-owns-speakers"
				Mode exists
			}
			False {
				SectionDevice."Speaker" {
					Comment "Speakers"

					EnableSequence [
						cset "name='Speaker Switch' on"
					]

					Value {
						PlaybackChannels "${var:PlaybackChannels}"
						PlaybackPriority 100
						PlaybackPCM "hw:${CardId},${var:SpeakerDevice}"
					}
				}
			}
		}
	}
}

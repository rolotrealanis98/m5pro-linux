# Keep speakersafetyd off the J716 speakers. Install as
# /usr/lib/systemd/system/speakersafetyd.service.d/50-m5pro-j716-hold.conf.
#
# speakersafetyd panics at main.rs:298 (an .unwrap() on a readi error other than ESTRPIPE) on this
# machine, and its profile (j716.conf, AID41) is calibrated against sense readings that are about
# 4x the electrical power (j716-profile/speakersafetyd/j716.conf.aid41 header). The speaker path is
# speakerguardd v2 with this Mac's own tuning; until it qualifies, the kernel holds the speakers at
# its floor. Headphones and microphones are not affected.
#
# Why this is needed beside upstream's own gate: speakerguardd-v2's 60-speakerguardd-v2-gate.conf
# starts speakersafetyd on a dual-interface kernel whenever the Mac is NOT switched to v2. On the
# J716 that would be the unprotected-by-v2 path, with a daemon that panics. With v2 qualified the
# gate stops speakersafetyd anyway; this hold covers the other case. All ExecCondition= lines of a
# unit must pass, so it does not touch v2's units or its gate.
#
# Pattern from betizzel/omarchy-m5 installer/recipes/linux-aurora-upstream/speakersafetyd-hold.conf
# @ 6b316fe76f41 (MIT), compatible apple,j714[sc]? -> apple,j716[sc]?.
[Service]
ExecCondition=/bin/sh -c '! tr "\\000" "\\n" < /proc/device-tree/compatible | grep -Eqx "apple,j716[sc]?"'

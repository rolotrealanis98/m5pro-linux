# J716s: move the speakers to speakerguardd v2 at boot, once this Mac's own tuning passes v2's
# checks. Install as /usr/lib/systemd/system/aurora-speaker-upgrade.service.d/70-m5pro-j716s-auto.conf.
#
# Source: betizzel/omarchy-m5 installer/recipes/omarchy-aurora-firmware/70-aurora-speaker-upgrade-auto.conf
# @ 101a6e6c4fa1 (omarchy-aurora-firmware j714s12, MIT), card name AppleJ714 -> AppleJ716, no
# AURORA_LZFSE_LIB (here liblzfse comes from the `lzfse` package, see README.md).
#
# --at-boot --i-understand-preview is upstream's documented opt-in for the boot unit
# (speakerguardd packaging/upgrade/README.md). The gate (gate.json, parity.json, the silent
# self-check, the switch test) decides; a refusal is recorded, not retried until the kernel,
# speakerguardd or the parity attestation changes, and the speakers stay at the kernel's floor.
# Undo: systemctl disable aurora-speaker-upgrade; aurora-speaker-upgrade --revert.
[Service]
ExecStart=
ExecStart=/usr/bin/aurora-speaker-upgrade run --at-boot --i-understand-preview
# The speaker card (AppleJ716, through the AOP) can register a fraction of a second after
# sound.target. On the J714s image the unit ran 0.2 s before the card on a fresh install and stopped
# with "not now: no speaker card yet", leaving the speakers at the floor (omarchy-m5 j714s12).
# Wait up to 60 s for it; never fail the unit here (the tool's own "not now" handles a missing card).
ExecStartPre=/bin/sh -c 'for i in $(seq 1 120); do [ -e /proc/asound/AppleJ716 ] && exit 0; sleep 0.5; done; echo "no AppleJ716 card after 60 s"; exit 0'
# speakerguardd#186 (open): the tool runs with umask 077 and creates /etc/speakerguardd 0700, which hides
# speakerguardd.conf from the seat user's session: provisioning, self-check and supervisor all pass and no speaker
# graph is ever linked (silent speakers). Create it 0755 before the tool runs, and repair it after.
ExecStartPre=/usr/bin/install -d -m0755 /etc/speakerguardd
ExecStartPost=/bin/chmod 0755 /etc/speakerguardd

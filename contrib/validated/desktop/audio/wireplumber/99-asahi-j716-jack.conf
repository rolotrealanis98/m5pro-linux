# WirePlumber fragment: J716 headphone jack and headset microphone routing.
# Install: /usr/share/wireplumber/wireplumber.conf.d/99-asahi-j716-jack.conf
#
# What the stack already does without this file (UCM + PipeWire's ACP):
#   - the jack codec's "Headphone Jack" / "Headset Mic Jack" controls drive the
#     availability of the "Headphones" and "Headset" routes (priority 300);
#   - the Headphones sink (priority.session 1000) outranks the speaker DSP
#     filter sink (850), so plugging headphones moves the default sink.
# What stops that from working, and what this file changes:
#   1. WirePlumber remembers every default sink the user ever picked (state
#      file default-nodes) and a remembered node outranks any priority. Once
#      the speaker filter has been chosen once (wpctl set-default, a settings
#      panel), plugging headphones no longer switches. Turning the history off
#      lets the jack decide: headphones in -> headphones, out -> speakers.
#      The same setting lets a connected Bluetooth sink take over.
#   2. The built-in microphone array (effect_output.j716-mic, priority 2005)
#      outranks the jack's headset microphone (2000), so a plugged headset
#      mic would never become the default source. The headset source is
#      raised above it; it only exists as a candidate while a headset is in.
# Takes effect when WirePlumber next starts (login or reboot).

wireplumber.settings = {
    node.restore-default-targets = false
}

monitor.alsa.rules = [
    {
        matches = [
            { api.alsa.path = "hw:AppleJ716,0", media.class = "Audio/Source" }
            { node.name = "alsa_input.platform-sound.HiFi__Headset__source" }
        ]
        actions = {
            update-props = {
                priority.session = 2500
            }
        }
    }
]

# WirePlumber fragment: Bluetooth audio on the J716 (Apple N1, btcentauri).
# Install: /usr/share/wireplumber/wireplumber.conf.d/99-asahi-j716-bluetooth.conf
#
# The kernel's btcentauri driver carries ACL only ("SCO and ISO delivery are
# not implemented"), and the kernel has no RFCOMM and no ISO sockets
# (CONFIG_BT_RFCOMM and CONFIG_BT_LE unset, so no iso.c). That leaves A2DP as
# the only audio profile. Offering HFP/HSP/BAP roles would only make PipeWire
# register profiles bluetoothd cannot serve and tempt WirePlumber into
# switching a headset to a profile that cannot carry audio, so they are off.
# A2DP codecs are left at PipeWire's default list (SBC, SBC-XQ, AAC, LDAC,
# aptX family, FastStream).
# If SCO and RFCOMM are ever built into the kernel, remove this file.
# Takes effect when WirePlumber next starts (login or reboot).

wireplumber.settings = {
    bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
    bluez5.roles = [ a2dp_sink a2dp_source ]
}

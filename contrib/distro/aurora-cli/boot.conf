# /etc/m5pro/boot.conf - read by m5pro-boot (KEY=value, one per line; quotes optional).
# Where the ESP is mounted and which partition it is.
#ESP=/boot
#ESP_DEV=/dev/nvme0n1p4
# Stage-2 loader image, first existing path wins (colon separated). aura-j716s until upstream aura carries the J716s hand-offs.
#LOADER=/usr/lib/aura-j716s/aura-stage2.bin:/usr/lib/asahi-boot/m1n1.bin
# What the pacman hook does after a kernel upgrade: no = build a test payload and print the plan; test = also install it as a
# self-reverting test boot.bin. A daily is never installed by a hook: boot it as a test, then `m5pro-boot promote`.
AUTO_INSTALL=no
# Seconds to idle after the last ESP write before returning (a restart while the SSD is busy counts as an unsafe shutdown).
#SETTLE=60
# Self-revert: seconds after network-online, and the host pinged.
#SELFTEST_DELAY=90
#NETCHECK_HOST=1.1.1.1
# mBoot builds the stub-refresh checklist treats as known to the loader and the kernel (27.2, 27.3 beta 1).
#SUPPORTED_FW="mBoot-20457.41. mBoot-20457.60."
# The kernel command line comes from /etc/m5pro/cmdline if it exists (one line, # comments allowed), otherwise from the
# running /proc/cmdline minus m5.selftest and BOOT_IMAGE.

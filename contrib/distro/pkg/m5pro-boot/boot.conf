# /etc/m5pro/boot.conf - read by m5pro-update-payload (shell syntax).
# Kernel command line packed into the payload as chosen.bootargs (max ~1000 bytes).
# /etc/m5pro/cmdline, if it exists, replaces this.
CMDLINE="earlycon=efifb keep_bootcon console=tty0 loglevel=4 pd_ignore_unused clk_ignore_unused nvme_apple.flush_interval=0 root=LABEL=m5root rw"
# ESP partition UUID when stage-1 does not pass chosen.asahi,efi-system-partition
# (the stage-1 installed on 2026-11-04 does not). The installer writes it.
ESP_PARTUUID=""
# Payloads kept in m5pro/payloads/ besides the ones a slot uses.
KEEP=4
